name: Terraform Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'infra/deploy/**'
  workflow_run:
    workflows: ["Dockerize Microservices"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Specific docker image tag (short commit SHA) to deploy'
        required: false
        type: string

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION || 'europe-central2' }}
  REGISTRY: ${{ secrets.GCP_REGION || 'europe-central2' }}-docker.pkg.dev
  REPOSITORY: slip-vault-repo

jobs:
  deploy:
    name: Terraform Deploy
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            TAG=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          else
            TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          fi
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV

      # =====================================================================
      # 1. Authenticate with Google Cloud
      # =====================================================================
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # =====================================================================
      # 2. Terraform Apply
      # =====================================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init
        working-directory: infra/deploy

      - name: Terraform Apply
        run: |
          terraform apply -auto-approve \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="pubsub_topic_name=slip-vault-tasks-topic" \
            -var="api_sa_email=slip-vault-api-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            -var="processor_sa_email=slip-vault-processor-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            -var="notification_sa_email=slip-vault-notification-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            -var="api_image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/slip-vault-api:${{ env.IMAGE_TAG }}" \
            -var="processor_image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/slip-vault-processor-agent:${{ env.IMAGE_TAG }}" \
            -var="notification_image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/slip-vault-notification:${{ env.IMAGE_TAG }}"
        working-directory: infra/deploy
