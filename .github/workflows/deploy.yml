name: Terraform Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy (api, notification, processor, or all)'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - api
          - notification
          - processor
      image_tag:
        description: 'Commit SHA tag (e.g. 3a93cd4) to deploy'
        required: true
        type: string

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION || 'europe-central2' }}

jobs:
  matrix-deploy:
    name: Deploy (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - id: api
            name: API Service
            dir: api
          - id: notification
            name: Notification Service
            dir: notification
          - id: processor
            name: Processor Agent
            dir: processor

    steps:
      - name: Checkout Code
        if: ${{ github.event.inputs.service == matrix.service.id || github.event.inputs.service == 'all' }}
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: ${{ github.event.inputs.service == matrix.service.id || github.event.inputs.service == 'all' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: ${{ github.event.inputs.service == matrix.service.id || github.event.inputs.service == 'all' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        if: ${{ github.event.inputs.service == matrix.service.id || github.event.inputs.service == 'all' }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        if: ${{ github.event.inputs.service == matrix.service.id || github.event.inputs.service == 'all' }}
        run: terraform init
        working-directory: infra/deploy/${{ matrix.service.dir }}

      - name: Terraform Apply
        if: ${{ github.event.inputs.service == matrix.service.id || github.event.inputs.service == 'all' }}
        run: |
          terraform apply -auto-approve \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="image_tag=${{ inputs.image_tag }}"
        working-directory: infra/deploy/${{ matrix.service.dir }}
