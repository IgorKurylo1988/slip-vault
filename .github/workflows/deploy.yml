name: Terraform Deploy to Cloud Run

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Commit SHA tag (e.g. 3a93cd4) to deploy'
        required: true
        type: string

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION || 'europe-central2' }}
  REGISTRY: ${{ secrets.GCP_REGION || 'europe-central2' }}-docker.pkg.dev
  REPOSITORY: slip-vault-repo

jobs:
  matrix-deploy:
    name: Terraform Deploy (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: slip-vault-api
            tf_target: google_cloud_run_v2_service.api_service
          - name: slip-vault-notification
            tf_target: google_cloud_run_v2_service.notification_service
          - name: slip-vault-processor-agent
            tf_target: google_cloud_run_v2_service.processor_agent

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Commit SHA Tag
        run: |
          echo "IMAGE_TAG=${{ inputs.image_tag }}" >> $GITHUB_ENV

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform init
        working-directory: infra/deploy

      - name: Terraform Apply (Target Service)
        run: |
          terraform apply -auto-approve \
            -target="${{ matrix.service.tf_target }}" \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ env.REGION }}" \
            -var="pubsub_topic_name=slip-vault-tasks-topic" \
            -var="api_sa_email=slip-vault-api-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            -var="processor_sa_email=slip-vault-processor-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            -var="notification_sa_email=slip-vault-notification-sa@${{ env.PROJECT_ID }}.iam.gserviceaccount.com" \
            -var="api_image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/slip-vault-api:${{ env.IMAGE_TAG }}" \
            -var="processor_image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/slip-vault-processor-agent:${{ env.IMAGE_TAG }}" \
            -var="notification_image=${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/slip-vault-notification:${{ env.IMAGE_TAG }}"
        working-directory: infra/deploy
