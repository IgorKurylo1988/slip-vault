name: Matrix Deploy to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'infra/deploy/**'
  workflow_run:
    workflows: ["Dockerize Microservices"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Specific docker image tag (short commit SHA) to deploy'
        required: false
        type: string

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: ${{ secrets.GCP_REGION || 'europe-central2' }}
  REGISTRY: ${{ secrets.GCP_REGION || 'europe-central2' }}-docker.pkg.dev
  REPOSITORY: slip-vault-repo

jobs:
  matrix-deploy:
    name: Deploy (${{ matrix.service.name }})
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: slip-vault-api
            filter_path: 'backend/api_service/**'
          - name: slip-vault-notification
            filter_path: 'backend/notification_service/**'
          - name: slip-vault-processor-agent
            filter_path: 'backend/processor_agent_invoice/**'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Commit SHA Tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [ -n "${{ github.event.workflow_run.head_sha }}" ]; then
            TAG=$(echo "${{ github.event.workflow_run.head_sha }}" | cut -c1-7)
          else
            TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          fi
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_ENV

      - name: Detect Service Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            changed:
              - '${{ matrix.service.filter_path }}'
              - 'backend/common/**'
              - 'infra/deploy/**'

      - name: Authenticate to Google Cloud
        if: ${{ steps.filter.outputs.changed == 'true' || github.event.inputs.image_tag != '' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: ${{ steps.filter.outputs.changed == 'true' || github.event.inputs.image_tag != '' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Service to Cloud Run
        if: ${{ steps.filter.outputs.changed == 'true' || github.event.inputs.image_tag != '' }}
        run: |
          TARGET_IMAGE="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service.name }}:${{ env.IMAGE_TAG }}"

          echo "Deploying ${{ matrix.service.name }} using ${TARGET_IMAGE}"
          gcloud run deploy ${{ matrix.service.name }} \
            --image="${TARGET_IMAGE}" \
            --region="${{ env.REGION }}" \
            --project="${{ env.PROJECT_ID }}" \
            --quiet
