name: Infra Pipeline

on:
  push:
    branches: [main]
    paths: ['infra/**']
  pull_request:
    paths: ['infra/**']

jobs:
  validate_web:
    name: Web - Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: infra/gcp/web

      - name: Terraform Init
        run: terraform init
        working-directory: infra/gcp/web

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra/gcp/web

      - name: Terraform Plan
        run: terraform plan -lock-timeout=5m -out=tfplan
        working-directory: infra/gcp/web
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-web
          path: infra/gcp/web/tfplan

  deploy_web:
    name: Web - Terraform Apply
    needs: validate_web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-web
          path: infra/gcp/web

      - name: Terraform Init
        run: terraform init
        working-directory: infra/gcp/web

      - name: Terraform Apply
        run: terraform apply -lock-timeout=5m -input=false tfplan
        working-directory: infra/gcp/web
        env:
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}

  validate_cloudflare:
    name: Cloudflare - Terraform Plan
    runs-on: ubuntu-latest
    # Wait for web deployment on main to ensure the load balancer IP is populated in GCS state
    needs: validate_web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Format Check
        run: terraform fmt -check
        working-directory: infra/cloudflare

      - name: Terraform Init
        run: terraform init
        working-directory: infra/cloudflare

      - name: Terraform Validate
        run: terraform validate
        working-directory: infra/cloudflare

      - name: Terraform Plan
        run: terraform plan -lock-timeout=5m -out=tfplan
        working-directory: infra/cloudflare
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Upload Plan Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-cloudflare
          path: infra/cloudflare/tfplan

  deploy_cloudflare:
    name: Cloudflare - Terraform Apply
    needs: [deploy_web, validate_cloudflare]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Download Plan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-cloudflare
          path: infra/cloudflare

      - name: Terraform Init
        run: terraform init
        working-directory: infra/cloudflare

      - name: Terraform Apply
        run: terraform apply -lock-timeout=5m -input=false tfplan
        working-directory: infra/cloudflare
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
