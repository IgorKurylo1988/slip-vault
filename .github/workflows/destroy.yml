name: Terraform Destroy Cloud Run Services

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to destroy (api, notification, processor, or all)'
        required: true
        type: choice
        default: 'all'
        options:
          - all
          - api
          - notification
          - processor
      region:
        description: 'Region of existing resources to destroy'
        required: true
        type: string
        default: 'europe-central2'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}

jobs:
  matrix-destroy:
    name: Destroy (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - id: api
            name: API Service
            dir: api
          - id: notification
            name: Notification Service
            dir: notification
          - id: processor
            name: Processor Agent
            dir: processor

    steps:
      - name: Checkout Code
        if: ${{ github.event.inputs.service == matrix.service.id || github.event.inputs.service == 'all' }}
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: ${{ github.event.inputs.service == matrix.service.id || github.event.inputs.service == 'all' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: ${{ github.event.inputs.service == matrix.service.id || github.event.inputs.service == 'all' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        if: ${{ github.event.inputs.service == matrix.service.id || github.event.inputs.service == 'all' }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        if: ${{ github.event.inputs.service == matrix.service.id || github.event.inputs.service == 'all' }}
        run: terraform init
        working-directory: infra/deploy/${{ matrix.service.dir }}

      - name: Terraform Destroy
        if: ${{ github.event.inputs.service == matrix.service.id || github.event.inputs.service == 'all' }}
        run: |
          terraform destroy -auto-approve \
            -var="project_id=${{ env.PROJECT_ID }}" \
            -var="region=${{ inputs.region }}" \
            -var="image_tag=dummy"
        working-directory: infra/deploy/${{ matrix.service.dir }}
