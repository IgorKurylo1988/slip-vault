name: Dockerize Microservices

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (api, notification, processor, or all)'
        required: false
        default: 'all'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: 'europe-north1'
  REGISTRY: 'europe-north1-docker.pkg.dev'
  REPOSITORY: slip-vault-repo

jobs:
  build-and-push:
    name: Build & Push (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: api
            image_name: slip-vault-api
            dockerfile: backend/api_service/Dockerfile
            filter_path: 'backend/api_service/**'
          - name: notification
            image_name: slip-vault-notification
            dockerfile: backend/notification_service/Dockerfile
            filter_path: 'backend/notification_service/**'
          - name: processor
            image_name: slip-vault-processor-agent
            dockerfile: backend/processor_agent_invoice/Dockerfile
            filter_path: 'backend/processor_agent_invoice/**'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Short SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Detect Changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            changed:
              - '${{ matrix.service.filter_path }}'
              - 'backend/common/**'
              - 'backend/requirements.txt'

      - name: Authenticate to Google Cloud
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == matrix.service.name || github.event.inputs.service == 'all')) || steps.filter.outputs.changed == 'true' }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == matrix.service.name || github.event.inputs.service == 'all')) || steps.filter.outputs.changed == 'true' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry Exists
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == matrix.service.name || github.event.inputs.service == 'all')) || steps.filter.outputs.changed == 'true' }}
        run: |
          gcloud artifacts repositories describe ${{ env.REPOSITORY }} --location=${{ env.REGION }} --project=${{ env.PROJECT_ID }} >/dev/null 2>&1 || \
          gcloud artifacts repositories create ${{ env.REPOSITORY }} \
            --repository-format=docker \
            --location=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --description="Docker Repository for Slip Vault microservices" \
            --quiet || true

      - name: Docker Auth Log-in
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == matrix.service.name || github.event.inputs.service == 'all')) || steps.filter.outputs.changed == 'true' }}
        run: gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Build & Push Image
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.service == matrix.service.name || github.event.inputs.service == 'all')) || steps.filter.outputs.changed == 'true' }}
        run: |
          IMAGE_PATH="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ matrix.service.image_name }}"
          docker build -t $IMAGE_PATH:${{ steps.vars.outputs.sha_short }} -t $IMAGE_PATH:latest -f ${{ matrix.service.dockerfile }} ./backend
          docker push $IMAGE_PATH:${{ steps.vars.outputs.sha_short }}
          docker push $IMAGE_PATH:latest
