version: '3.8'

services:
  gcs-emulator:
    image: fsouza/fake-gcs-server:latest
    container_name: gcs_emulator_main
    ports:
      - "4443:4443"
    command: -scheme http

  pubsub-emulator:
    image: google/cloud-sdk:emulators
    container_name: pubsub_emulator_main
    ports:
      - "8085:8085"
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085

  api_service:
    build:
      context: ./backend
      dockerfile: api_service/Dockerfile
    container_name: slip_vault_api
    ports:
      - "8000:8000"
    command: uvicorn api_service.app:app --host 0.0.0.0 --port 8000
    depends_on:
      - gcs-emulator
      - pubsub-emulator
    environment:
      - STORAGE_PROVIDER=GCS
      - MESSAGING_PROVIDER=GCP_PUBSUB
      - GCP_PROJECT_ID=slip-vault-project
      - GCP_GCS_BUCKET=slip-vault-bucket
      - GCP_PUBSUB_TOPIC_ID=slip-vault-topic
      - GCP_PUBSUB_SUBSCRIPTION_ID=slip-vault-sub
      # Tells the Google Storage SDK to use the local container endpoint
      - STORAGE_EMULATOR_HOST=http://gcs-emulator:4443
      # Tells the Google Pub/Sub SDK to use the local container endpoint
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
    volumes:
      - ./backend:/app

  processor_service:
    build:
      context: ./backend
      dockerfile: processor_service/Dockerfile
    container_name: slip_vault_worker
    command: python processor_service/worker.py
    depends_on:
      - gcs-emulator
      - pubsub-emulator
    environment:
      - STORAGE_PROVIDER=GCS
      - MESSAGING_PROVIDER=GCP_PUBSUB
      - GCP_PROJECT_ID=slip-vault-project
      - GCP_GCS_BUCKET=slip-vault-bucket
      - GCP_PUBSUB_TOPIC_ID=slip-vault-topic
      - GCP_PUBSUB_SUBSCRIPTION_ID=slip-vault-sub
      - STORAGE_EMULATOR_HOST=http://gcs-emulator:4443
      - PUBSUB_EMULATOR_HOST=pubsub-emulator:8085
      # Load LLM configurations from the host shell environment variables
      - LLM_MODEL=${LLM_MODEL:-gemini/gemini-2.5-flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./backend:/app

  web_service:
    build:
      context: ./web
    container_name: slip_vault_web
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      # Anonymous volume prevents host-mount overrides from wiping container node_modules
      - /app/node_modules
    depends_on:
      - api_service
    environment:
      - NODE_ENV=development
