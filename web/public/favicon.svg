<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect x="8" y="8" width="80" height="80" rx="20" fill="url(#bg-grad)" />
  
  <!-- Cloud/Document graphic similar to AppLogo -->
  <g transform="translate(18, 14) rotate(-6) scale(1.1)">
    <!-- Main document white sheet -->
    <rect x="10" y="10" width="40" height="48" rx="6" fill="#ffffff" />
    <!-- Header items inside document -->
    <rect x="15" y="16" width="10" height="4" rx="2" fill="#10b981" />
    <rect x="29" y="16" width="6" height="4" rx="2" fill="#e2e8f0" />
    
    <!-- Document lines -->
    <rect x="15" y="26" width="20" height="2.5" rx="1" fill="#cbd5e1" />
    <rect x="15" y="32" width="15" height="2.5" rx="1" fill="#cbd5e1" />
    <rect x="15" y="38" width="25" height="2.5" rx="1" fill="#cbd5e1" />
    
    <!-- Blue accent line at the bottom -->
    <rect x="10" y="50" width="40" height="8" rx="2" fill="#dbeafe" />
  </g>

  <!-- Search Lens at the bottom right -->
  <g transform="translate(56, 56) scale(0.9)">
    <circle cx="16" cy="16" r="8" fill="none" stroke="#ffffff" stroke-width="4.5" />
    <line x1="22" y1="22" x2="30" y2="30" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
