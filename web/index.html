  <style>
    /* Custom utility for a receipt-like jagged edge */
    .jagged-edge {
      background: linear-gradient(135deg, transparent 5px, white 5px) top left,
        linear-gradient(225deg, transparent 5px, white 5px) top right;
      background-size: 10px 10px;
      background-repeat: repeat-x;
      height: 10px;
      width: 100%;
    }

    .jagged-edge-bottom {
      background: linear-gradient(45deg, transparent 5px, white 5px) bottom left,
        linear-gradient(315deg, transparent 5px, white 5px) bottom right;
      background-size: 10px 10px;
      background-repeat: repeat-x;
      height: 10px;
      width: 100%;
    }

    /* Hide scrollbar for clean mobile look */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
